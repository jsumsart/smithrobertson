<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smith Robertson Museum + Cultural Center Editor Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260703a" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <p id="loginEyebrow" class="eyebrow">Archive Access</p>
        <h1 id="loginTitle">Enter the archive password.</h1>
        <p id="loginIntro" class="hero__lede">
          Public visitors can explore exhibit lead records and selected highlights. Full archive browsing and the majority of record pages are available behind a password on this front-end access screen.
        </p>

        <form id="archiveLoginForm" class="auth-form auth-form--standalone">
          <label class="field">
            <span>Password</span>
            <input id="archivePassword" type="password" autocomplete="current-password" placeholder="Enter archive password" />
          </label>
          <div class="login-card__actions">
            <button id="archiveSubmit" class="button button--primary" type="submit">Open Archive</button>
            <button id="archiveSignOut" class="button button--ghost" type="button" hidden>Sign Out</button>
          </div>
        </form>

        <p id="loginMessage" class="help-text"></p>

        <div class="login-card__footer">
          <a class="button button--ghost" href="./">Back to Digital Gallery</a>
          <a id="loginArchiveLink" class="button button--ghost" href="./archive.html">Go to Archive</a>
        </div>
      </section>
    </main>

    <script src="./data-source-config.js"></script>
    <script type="module" src="./login.js?v=20260703c"></script>
  </body>
</html>
