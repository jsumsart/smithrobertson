<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smith Robertson Collections Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260507a" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <p id="loginEyebrow" class="eyebrow">Museum Collections Login</p>
        <h1 id="loginTitle">Sign in to the collections manager.</h1>
        <p id="loginIntro" class="hero__lede">
          This login takes you into the private cataloging dashboard for records, media, and metadata management.
        </p>

        <form id="loginForm" class="auth-form auth-form--standalone">
          <label class="field">
            <span>Email</span>
            <input id="loginEmail" type="email" autocomplete="email" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input id="loginPassword" type="password" autocomplete="current-password" required />
          </label>
          <div class="stack stack--column">
            <button type="submit" class="button button--primary">Sign In</button>
            <button type="button" id="loginCreateAccount" class="button button--ghost">Create Account</button>
          </div>
        </form>

        <p id="loginMessage" class="help-text"></p>

        <div class="login-card__footer">
          <a class="button button--ghost" href="./catalog.html">Back to Digital Gallery</a>
          <a class="button button--ghost" href="./archive.html">Open Archive</a>
        </div>
      </section>
    </main>

    <script src="./supabase-config.js"></script>
    <script type="module" src="./login.js?v=20260507a"></script>
  </body>
</html>
